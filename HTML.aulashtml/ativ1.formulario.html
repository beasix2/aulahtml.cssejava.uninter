<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Pedidos Pizza</h1>
    <form method="post" action="teste.jsp">
       Name: <input type="text" name="Nome"> <br>
       E-mail: <input type="email" name="E-mail"> <br>
       Tamanho: 
       <input type="radio" name="tamanho" value="g" checked> Grande
       <input type="radio" name="tamanho" value="m"> Médio
       <input type="radio" name="tamanho" value="p"> Peuqueno
       <br>
       Sabor: <select name="Sabor">
        <option>Calabresa</option>
        <option>Napolitana</option>
        <option>Mussarela</option>
        <option>Frango com catupiri</option>
         </select>
        <br>

        Adicionais: 
        <input type="checkbox" name="borda" value="sim"> Borda
        <input type="checkbox" name="borda" value="sim"> Borda catupiri
        <input type="checkbox" name="borda" value="sim"> Borda cheda
        <input type="checkbox" name="borda" value="sim"> Queijo Extra <br>

        Data de entrega: <input type="date" name="DataEntrega"> <br>
        Comentário: <br>
        <textarea name="Mensagem" rows="10" cols="30"></textarea> <br>
        <input type="submit">


    </form>
</body>
</html>
